name: Laporan Kurs Harian BI

on:
  schedule:
    # Jadwal Utama: Senin s/d Jumat pukul 01:05 UTC (Pukul 08:05 WIB) - Menghindari jam sibuk :00
    - cron: '5 1 * * 1-5'
    # Jadwal Cadangan: Senin s/d Jumat pukul 01:20 UTC (Pukul 08:20 WIB) - Otomatis skip jika jadwal utama sudah sukses
    - cron: '20 1 * * 1-5'
  workflow_dispatch:
    # Memungkinkan tombol "Run workflow" manual di GitHub Actions kapanpun

jobs:
  run-kurs-reporter:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Diperlukan agar github-actions[bot] diizinkan git push menyimpan riwayat
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Jalankan Smart Polling & Kirim Email Kurs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          USE_TLS: ${{ secrets.USE_TLS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
        run: |
          python main.py --poll

      - name: Simpan Riwayat Kurs & Log Audit (Commit data/)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git commit -m "Automated Kurs & Audit Log Update [skip ci]" || true
          git push origin HEAD || true
